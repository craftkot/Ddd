name: Build Ashes Duel APK
on:
  push:
    branches:
      - feature/card-roguelike-pvp
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  pull_request:
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: rogue-duel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Check HTML and JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          assert '<html' in s and '</html>' in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/ashes-duel-syntax.js').write_text(js[0])
          PY
          node --check /tmp/ashes-duel-syntax.js
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AshesDuel-v0.1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pepel-i-Karty-Android-APK
          path: rogue-duel/app/build/outputs/apk/debug/AshesDuel-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
