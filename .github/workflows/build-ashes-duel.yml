name: Build Ashes Duel APK
on:
  push:
    branches:
      - feature/card-roguelike-pvp
      - feature/ashes-room-art-v08
      - feature/ashes-character-redesign-v09
      - feature/ashes-av-fate-combat-v10
      - feature/ashes-icon-install-v011
      - fix/ashes-android-startup-v012
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  pull_request:
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  workflow_dispatch:

concurrency:
  group: ashes-duel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    defaults:
      run:
        working-directory: rogue-duel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Check HTML and JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          assert '<html' in s and '</html>' in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/ashes-duel-syntax.js').write_text(js[0])
          PY
          node --check /tmp/ashes-duel-syntax.js
          test -s app/src/main/assets/artbook.css
          test -s app/src/main/assets/character-redesign.css
          test -s app/src/main/assets/fate-combat.css
          test -s app/src/main/assets/turn-sequence.js
          grep -q 'turn-sequence.js' app/src/main/assets/index.html
          test -s app/src/main/assets/art/arena.webp
          test -s app/src/main/assets/art/ashes-cover.webp
          test -s app/src/main/res/drawable-nodpi/ashes_launcher.webp
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'targetSdk 35' app/build.gradle
          grep -q 'loadDataWithBaseURL' app/src/main/java/com/ehtid/ashesduel/MainActivity.java
          grep -q 'appassets.androidplatform.net' app/src/main/java/com/ehtid/ashesduel/MainActivity.java
          grep -q 'ASHES_READY' app/src/main/java/com/ehtid/ashesduel/MainActivity.java
          grep -q 'AndroidNet.ready()' app/src/main/assets/run-save.js
          grep -q "applicationIdSuffix '.trial'" app/build.gradle
          test -s app/src/main/assets/art/atlas.webp
          test -s app/src/main/assets/art/kenney/icons/sword.png
          test -s app/src/main/assets/art/kenney/heroes/red_character.png
          grep -q 'EHTID-RELAY-ACCESS-V1:' app/src/main/assets/index.html
          grep -q 'ehtid-chat-relay.craftkot404.workers.dev' app/src/main/java/com/ehtid/ashesduel/MainActivity.java
          if grep -q 'ntfy.sh' app/src/main/java/com/ehtid/ashesduel/MainActivity.java; then echo "Old transport remains"; exit 1; fi
          for file in app/src/main/assets/expansion-{data,relics,combat,visual}.js app/src/main/assets/pvp-balance.js app/src/main/assets/turn-sequence.js app/src/main/assets/atelier.js app/src/main/assets/route-tree.js app/src/main/assets/connection-ui.js app/src/main/assets/encounter-director.js app/src/main/assets/run-economy.js app/src/main/assets/run-save.js; do node --check "$file"; done
      - name: Test deck engine and relic interactions
        run: |
          node tests/gameplay.test.cjs
          node tests/route.test.cjs
          node tests/design.test.cjs
          node tests/character-art.test.cjs
          node tests/av-layout.test.cjs
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AshesDuel-v0.12-trial.apk
      - name: Enable Android emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Smoke test real Android app launch (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            set -e
            adb install "$GITHUB_WORKSPACE/rogue-duel/app/build/outputs/apk/debug/app-debug.apk"
            adb logcat -c
            adb shell am start -W -n com.ehtid.ashesduel.trial/com.ehtid.ashesduel.MainActivity
            for attempt in $(seq 1 30); do
              if adb logcat -d -s AshesStartup:I '*:S' | grep -q ASHES_READY; then
                echo "PASS: Android native activity and JavaScript game launched."
                exit 0
              fi
              if adb logcat -d -s AshesStartup:E '*:S' | grep -q STARTUP_ERROR; then
                echo "FAIL: native startup error"
                adb logcat -d -s AshesStartup:V AndroidRuntime:E '*:S' | tail -120
                exit 1
              fi
              sleep 2
            done
            echo "FAIL: timeout without ASHES_READY (WebView blank/crashed)"
            adb logcat -d -s AshesStartup:V AndroidRuntime:E chromium:E '*:S' | tail -150
            exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Pepel-i-Karty-Android-APK
          path: rogue-duel/app/build/outputs/apk/debug/AshesDuel-v0.12-trial.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish validated v0.12 Android startup fix
        if: (github.event_name == 'push' && github.ref == 'refs/heads/fix/ashes-android-startup-v012') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/ashes-android-startup-v012' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          cd app/build/outputs/apk/debug
          sha256sum AshesDuel-v0.12-trial.apk > SHA256SUMS.txt
          cd -
          if gh release view ashes-duel-v0.12.0-test >/dev/null 2>&1; then
            gh release upload ashes-duel-v0.12.0-test app/build/outputs/apk/debug/AshesDuel-v0.12-trial.apk#AshesDuel-v0.12-trial.apk app/build/outputs/apk/debug/SHA256SUMS.txt#SHA256SUMS.txt --clobber
            gh release edit ashes-duel-v0.12.0-test --target "$TARGET_SHA" || true
          else
            gh release create ashes-duel-v0.12.0-test app/build/outputs/apk/debug/AshesDuel-v0.12-trial.apk#AshesDuel-v0.12-trial.apk app/build/outputs/apk/debug/SHA256SUMS.txt#SHA256SUMS.txt --target "$TARGET_SHA" --prerelease --title "Пепел и карты v0.12 — исправление запуска" --notes "Игровой HTML загружается непосредственно из APK с безопасным appassets HTTPS origin; видимый экран ошибки и кнопка повтора при сбое WebView; Android-эмулятор smoke-test запускает приложение и проверяет ASHES_READY. Установка рядом с v0.11 под отдельным пробным package, старые данные не удаляются. Play Protect по-прежнему может проверять не-магазинные APK. Только тестовая подпись."
          fi

      - name: Publish v0.11 updated Android beta
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/ashes-icon-install-v011') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/ashes-icon-install-v011' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          cd app/build/outputs/apk/debug
          sha256sum AshesDuel-v0.11-debug.apk > SHA256SUMS.txt
          cd -
          if gh release view ashes-duel-v0.11.0-beta >/dev/null 2>&1; then
            gh release upload ashes-duel-v0.11.0-beta app/build/outputs/apk/debug/AshesDuel-v0.11-debug.apk#AshesDuel-v0.11-debug.apk app/build/outputs/apk/debug/SHA256SUMS.txt#SHA256SUMS.txt --clobber
            gh release edit ashes-duel-v0.11.0-beta --target "$TARGET_SHA" || true
          else
            gh release create ashes-duel-v0.11.0-beta app/build/outputs/apk/debug/AshesDuel-v0.11-debug.apk#AshesDuel-v0.11-debug.apk app/build/outputs/apk/debug/SHA256SUMS.txt#SHA256SUMS.txt --target "$TARGET_SHA" --prerelease --title "Пепел и карты v0.11 Beta — иконка и Android 15" --notes "Новая оригинальная иконка и обложка Оракула; targetSdk 35 вместо 32; WebView Safe Browsing и запрет загрузки удалённых страниц/скриптов, только INTERNET. APK подписана отладочным ключом и это НЕ гарантирует отсутствие Play Protect Scan: рекомендации сканирования контролирует Android, а для стабильных обновлений нужен отдельный долгосрочный секретный ключ релизной подписи. Установка поверх APK с другой подписью может потребовать переустановку (предварительно сохраните данные)."
          fi

      - name: Publish v0.10 AV combat beta
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/ashes-av-fate-combat-v10') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/ashes-av-fate-combat-v10' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if gh release view ashes-duel-v0.10.0-beta >/dev/null 2>&1; then
            gh release upload ashes-duel-v0.10.0-beta app/build/outputs/apk/debug/AshesDuel-v0.11-debug.apk#AshesDuel-v0.11-debug.apk --clobber
            gh release edit ashes-duel-v0.10.0-beta --target "$TARGET_SHA" || true
          else
            gh release create ashes-duel-v0.10.0-beta app/build/outputs/apk/debug/AshesDuel-v0.11-debug.apk#AshesDuel-v0.11-debug.apk --target "$TARGET_SHA" --prerelease --title "Пепел и карты v0.10 Beta — AV / 5 очков навыков" --notes "Новая очередь Action Value с отображением ходов, ресурс до 5 очков навыков, базовая атака +1 ОН, карточные действия в PvE и PvP, новая арена для 1–4 мобов без горизонтального скролла, переработанный визуал 161 карт с полным текстом. APK подписан debug-ключом. Интернет-PvP между двумя телефонами требует ручного теста."
          fi

      - name: Publish v0.9 beta with redesigned characters
        if: (github.event_name == 'push' && github.ref == 'refs/heads/feature/ashes-character-redesign-v09') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/ashes-character-redesign-v09' && github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if gh release view ashes-duel-v0.9.0-beta >/dev/null 2>&1; then
            gh release upload ashes-duel-v0.9.0-beta app/build/outputs/apk/debug/AshesDuel-v0.9-debug.apk#AshesDuel-v0.9-debug.apk --clobber
            gh release edit ashes-duel-v0.9.0-beta --target "$TARGET_SHA" || true
          else
            gh release create ashes-duel-v0.9.0-beta app/build/outputs/apk/debug/AshesDuel-v0.9-debug.apk#AshesDuel-v0.9-debug.apk --target "$TARGET_SHA" --prerelease --title "Пепел и карты v0.9 Beta — новый дизайн персонажей" --notes "9 новых детализированных оригинальных персонажей (3 героя, 6 противников), прозрачные WebP с офлайн-загрузкой, переработанный выбор класса и масштабирование в бою/PvP. Сеть EHTID Cloudflare Relay сохранена. Отладочная подпись APK; реальные сетевые тесты на двух телефонах ещё необходимы."
          fi

      - name: Publish v0.8 beta APK for testers
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/ashes-room-art-v08'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view ashes-duel-v0.8.0-beta >/dev/null 2>&1; then
            gh release upload ashes-duel-v0.8.0-beta app/build/outputs/apk/debug/AshesDuel-v0.8-debug.apk#AshesDuel-v0.8-debug.apk --clobber
            gh release edit ashes-duel-v0.8.0-beta --target "$GITHUB_SHA" || true
          else
            gh release create ashes-duel-v0.8.0-beta app/build/outputs/apk/debug/AshesDuel-v0.8-debug.apk#AshesDuel-v0.8-debug.apk --target "$GITHUB_SHA" --prerelease --title "Пепел и карты v0.8 Beta — комнаты EHTID / Artbook" --notes "Тестовая Android APK. Подключение через EHTID Cloudflare Relay с четырёхзначным игровым кодом, новая офлайн-графика Kenney CC0 и оригинальный арт. Сборка с debug-сертификатом: обновление поверх старого APK может не пройти. Проверка сети на двух устройствах не завершена. Имеются ограничения безопасности короткого кода."
          fi

      - name: Publish installable APK on GitHub Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/card-roguelike-pvp'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ashes-duel-v0.7.0 --yes --cleanup-tag || true
          gh release create ashes-duel-v0.7.0 app/build/outputs/apk/debug/AshesDuel-v0.7-debug.apk#AshesDuel-v0.7-debug.apk --target "$GITHUB_SHA" --title "Пепел и карты v0.7 — Android" --notes "Открытая тестовая версия карточного рогалика на двух игроков. APK подписан отладочным ключом. Интернет-PvP не проверен на реальных телефонах."
