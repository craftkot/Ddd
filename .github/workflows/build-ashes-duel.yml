name: Build Ashes Duel APK
on:
  push:
    branches:
      - feature/card-roguelike-pvp
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  pull_request:
    paths:
      - 'rogue-duel/**'
      - '.github/workflows/build-ashes-duel.yml'
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: rogue-duel
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Check HTML and JS syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('app/src/main/assets/index.html').read_text()
          assert '<html' in s and '</html>' in s
          js=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert len(js)==1
          Path('/tmp/ashes-duel-syntax.js').write_text(js[0])
          PY
          node --check /tmp/ashes-duel-syntax.js
          for file in app/src/main/assets/expansion-{data,relics,combat,visual}.js app/src/main/assets/pvp-balance.js app/src/main/assets/atelier.js app/src/main/assets/route-tree.js app/src/main/assets/connection-ui.js; do node --check "$file"; done
      - name: Test deck engine and relic interactions
        run: |
          node tests/gameplay.test.cjs
          node tests/route.test.cjs
      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AshesDuel-v0.6-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Pepel-i-Karty-Android-APK
          path: rogue-duel/app/build/outputs/apk/debug/AshesDuel-v0.6-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish installable APK on GitHub Releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ashes-duel-v0.6.0 --yes --cleanup-tag || true
          gh release create ashes-duel-v0.6.0 app/build/outputs/apk/debug/AshesDuel-v0.6-debug.apk#AshesDuel-v0.6-debug.apk --target "$GITHUB_SHA" --title "Пепел и карты v0.6 — Android" --notes "Открытая тестовая версия карточного рогалика на двух игроков. APK подписан отладочным ключом. Интернет-PvP не проверен на реальных телефонах."
