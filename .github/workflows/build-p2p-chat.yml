name: Build P2P Chat APK
on:
  push:
    branches:
      - feature/p2p-chat
    paths:
      - 'p2p-chat/**'
      - '.github/workflows/build-p2p-chat.yml'
  workflow_dispatch:

# Only the newest commit should consume Android CI capacity and publish APKs.
concurrency:
  group: ehtid-chat-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: p2p-chat
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore permanent signing key
        env:
          EHTID_SIGNING_PASSWORD: ${{ secrets.kuyga }}
        run: |
          set -euo pipefail
          if [ -z "${EHTID_SIGNING_PASSWORD:-}" ]; then
            echo "::error::GitHub Actions secret named kuyga is missing. Add or correct it via Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ci-signing
          base64 --decode ci-signing/permanent-release.p12.enc.b64 > ci-signing/permanent-release.p12.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -md sha256 \
            -in ci-signing/permanent-release.p12.enc \
            -out ci-signing/permanent-release.p12 \
            -pass env:EHTID_SIGNING_PASSWORD
          chmod 600 ci-signing/permanent-release.p12
          keytool -list -keystore ci-signing/permanent-release.p12 \
            -storetype PKCS12 -alias ehtid \
            -storepass:env EHTID_SIGNING_PASSWORD > /dev/null
      - name: Verify room and relay rate-limit policies
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compile consistently signed APK
        env:
          EHTID_SIGNING_PASSWORD: ${{ secrets.kuyga }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK archive and signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          EXPECTED="efabef78a3c7dc1cf3be833d83e2e02d221685b90c120b1018c6b5e249ac7c77"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\r' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Wrong signing certificate! Expected permanent EHTID identity, got: $ACTUAL"
            exit 1
          fi
          echo "Verified permanent certificate SHA-256: $ACTUAL"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EHTID-P2P-Chat-debug-APK
          path: p2p-chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="EHTID-P2P-Chat-v1.2.apk"
          cp "$APK" "$RELEASE_APK"
          TAG="ehtid-p2p-chat-v1.2"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/feature/p2p-chat" --jq '.object.sha')"
          if [ "$LATEST" != "$GITHUB_SHA" ]; then
            echo "::warning::Skipping stale APK: branch head is $LATEST but build is $GITHUB_SHA"
            exit 0
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RELEASE_APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EHTID P2P Chat v1.2 (Android beta)" --notes "EHTID Chat v1.2: saved room list with names, quick switching and safe per-room SQLite history migration; signed GitHub APK updater with SHA-256/certificate verification, periodic checks and automatic download. Android requires user approval for installation. Supports all v1.1 voice, media and Cloudflare features. Same application ID and permanent signer; install over v1.1 without uninstalling or erasing chat data." --prerelease
          fi
      - name: Smoke test APK in Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash p2p-chat/scripts/ci-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EHTID-P2P-Emulator-QA
          path: p2p-chat/build/ci/
          if-no-files-found: warn
