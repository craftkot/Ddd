name: Build P2P Chat APK
on:
  push:
    branches:
      - feature/p2p-chat
    paths:
      - 'p2p-chat/**'
      - '.github/workflows/build-p2p-chat.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: p2p-chat
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Verify multi-visitor presence rules
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compile APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK archive and signing
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -tq app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EHTID-P2P-Chat-debug-APK
          path: p2p-chat/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="EHTID-P2P-Chat-v0.4.apk"
          cp "$APK" "$RELEASE_APK"
          TAG="ehtid-p2p-chat-v0.4"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RELEASE_APK" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$RELEASE_APK" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "EHTID P2P Chat v0.4 (Android beta)" --notes "Multi-user Internet chat beta: room-wide encrypted relay broadcasting, no eviction of existing direct guest, foreground status (В сети), background presence, sampled relay RTT, reduced service traffic. Not production-security audited. Requires Android 7+." --prerelease
          fi
      - name: Smoke test APK in Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash p2p-chat/scripts/ci-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EHTID-P2P-Emulator-QA
          path: p2p-chat/build/ci/
          if-no-files-found: warn
