name: RelayBox Android • Build + automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Pure Java unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Android static analysis
        run: gradle --no-daemon :app:lintDebug
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK archive, signing and app icon
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > build/apk-badging.txt
          grep -q "application-label:'RelayBox'" build/apk-badging.txt
          grep -q "application-icon-" build/apk-badging.txt
          grep -q "package: name='dev.relaybox.app'" build/apk-badging.txt
      - name: Enable KVM acceleration on hosted runner
        run: |
          if test -e /dev/kvm; then sudo chmod 666 /dev/kvm; fi
      - name: Install and smoke-test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p build/ci
            adb shell am start -W -n dev.relaybox.app/.MainActivity
            adb shell screencap -p /sdcard/relaybox-home.png
            adb pull /sdcard/relaybox-home.png build/ci/relaybox-home.png
      - name: Upload test reports and emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RelayBox-v0.4-qa-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            app/build/test-results/
            build/apk-badging.txt
            build/ci/relaybox-home.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RelayBox-v0.4-verified-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
