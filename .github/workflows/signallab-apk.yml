name: SignalLab APK
on:
  push:
    branches: [build/signallab-apk-20261102]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK on runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -lah "$ANDROID_HOME" || true
          find "$ANDROID_HOME" -maxdepth 5 -name sdkmanager -type f || true
          ls "$ANDROID_HOME/platforms" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
          else
            echo "Using pre-installed SDK and Gradle auto-download"
          fi
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SignalLab-v1.0.2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
