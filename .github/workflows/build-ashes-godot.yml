name: Build native Godot Android
on:
  push:
    branches: [feature/card-roguelike-pvp]
    paths:
      - "godot-duel/**"
      - ".github/workflows/build-ashes-godot.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK components using the runner SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Godot 4.7.2 editor and Android templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          mkdir -p /tmp/godot-bin
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64
          ln -sf /tmp/godot-bin/Godot_v4.7.2-stable_linux.x86_64 /tmp/godot-bin/godot
          echo /tmp/godot-bin >> "$GITHUB_PATH"
          curl -fsSL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable" /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          /tmp/godot-bin/godot --headless --version
      - name: Configure Android export
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import Godot and validate GDScript
        run: godot --headless --path godot-duel --editor --quit
      - name: Test native rules
        run: godot --headless --path godot-duel --script res://scripts/smoke.gd
      - name: Run live native scene regression
        run: |
          godot --headless --path godot-duel --script res://scripts/smoke_ui.gd 2>&1 | tee /tmp/ui-smoke.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR:|UI SMOKE FAILED' /tmp/ui-smoke.log; then exit 1; fi
      - name: Test native GUI startup
        run: |
          godot --headless --path godot-duel --quit-after 3 2>&1 | tee /tmp/native-start.log
          if grep -E 'SCRIPT ERROR|Parse Error|Invalid call|ERROR: Failed' /tmp/native-start.log; then exit 1; fi
      - name: Export Android debug APK
        run: |
          mkdir -p godot-duel/build
          godot --headless --path godot-duel --export-debug Android build/AshesGodot-v0.10-debug.apk
          test -s godot-duel/build/AshesGodot-v0.10-debug.apk
          unzip -tq godot-duel/build/AshesGodot-v0.10-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify godot-duel/build/AshesGodot-v0.10-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Ashes-Godot-Native-Android
          path: godot-duel/build/AshesGodot-v0.10-debug.apk
          if-no-files-found: error
      - name: Publish separate Godot alpha
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ashes-godot-v0.10.0-alpha --yes --cleanup-tag || true
          gh release create ashes-godot-v0.10.0-alpha godot-duel/build/AshesGodot-v0.10-debug.apk#AshesGodot-v0.10-debug.apk --target "$GITHUB_SHA" --title "Пепел и карты · Godot v0.10 alpha" --notes "Original AI-generated illustrated atlas, heroes, enemies, illustrated cards, blood-moon arena. Offline Godot PvE. Online PvP remains in the earlier APK."
