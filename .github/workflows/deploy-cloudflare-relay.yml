name: Deploy EHTID Relay to Cloudflare
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RELAY_ACCESS_TOKEN: ${{ secrets.EHTID_RELAY_TOKEN }}
    defaults:
      run:
        working-directory: cloudflare-relay
    steps:
      - uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secrets and Worker tests
        run: |
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test "${#RELAY_ACCESS_TOKEN}" -ge 24 || { echo "::error::EHTID_RELAY_TOKEN must contain at least 24 characters"; exit 1; }
          node --check src/index.mjs
          node --test
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Create or find D1 database
        run: |
          set -euo pipefail
          npx wrangler d1 list --json > "$RUNNER_TEMP/ehtid-d1-list.json"
          if ! node -e "const f=require('fs'); const list=JSON.parse(f.readFileSync(process.argv[1])); process.exit(list.some(x=>x.name==='ehtid-chat')?0:1)" "$RUNNER_TEMP/ehtid-d1-list.json"; then
            npx wrangler d1 create ehtid-chat --location weur
          fi
          npx wrangler d1 list --json > "$RUNNER_TEMP/ehtid-d1-list.json"
          node -e "const f=require('fs'); const list=JSON.parse(f.readFileSync(process.argv[1])); const found=list.find(x=>x.name==='ehtid-chat'); if(!found||!found.uuid) throw Error('EHTID D1 not found'); let cfg=f.readFileSync('wrangler.toml','utf8'); cfg=cfg.replace(/database_id = \"[a-f0-9-]+\"/, 'database_id = \"'+found.uuid+'\"'); f.writeFileSync('wrangler.toml',cfg)" "$RUNNER_TEMP/ehtid-d1-list.json"
      - name: Initialize D1 schema (safe to repeat)
        run: npx wrangler d1 execute ehtid-chat --remote --file=./schema.sql --yes
      - name: Deploy and smoke-test authenticated Worker
        run: |
          set -euo pipefail
          trap 'rm -f .env.production' EXIT
          umask 077
          printf 'RELAY_ACCESS_TOKEN=%s\n' "$RELAY_ACCESS_TOKEN" > .env.production
          npx wrangler deploy --secrets-file .env.production | tee "$RUNNER_TEMP/ehtid-deploy.log"
          URL="$(grep -Eo 'https://[[:alnum:].-]+\.workers\.dev' "$RUNNER_TEMP/ehtid-deploy.log" | head -1 || true)"
          if [ -z "$URL" ]; then
            echo "::warning::Worker deployed but public URL could not be parsed from Wrangler output"
            echo "Copy the HTTPS workers.dev address from the deployment logs."
          else
            echo "### EHTID Cloudflare Worker" >> "$GITHUB_STEP_SUMMARY"
            echo "Server URL: $URL" >> "$GITHUB_STEP_SUMMARY"
            curl -fsS "$URL/health" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(!JSON.parse(s).ok)process.exit(1)})"
            curl -fsS -H "Authorization: Bearer $RELAY_ACCESS_TOKEN" "$URL/auth" | node -e "let s='';process.stdin.on('data',x=>s+=x).on('end',()=>{if(!JSON.parse(s).authenticated)process.exit(1)})"
            echo "Deployment and authenticated health checks passed." >> "$GITHUB_STEP_SUMMARY"
          fi
