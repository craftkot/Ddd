plugins { id 'com.android.application' }
android {
    namespace 'com.ehtid.ashesduel'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ehtid.ashesduel'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.15.0'
    }
    // Trial APK installs alongside older CI builds signed by different ephemeral
    // debug certificates. Existing game/save data is NOT overwritten.
    buildTypes {
        debug {
            applicationIdSuffix '.v15'
            versionNameSuffix '-trial'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
