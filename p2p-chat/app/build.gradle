plugins {
    id 'com.android.application'
}
android {
    namespace 'com.ehtid.p2pchat'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ehtid.p2pchat'
        minSdk 24
        targetSdk 32
        versionCode 2
        versionName '0.2.0-internet'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'io.github.webrtc-sdk:android:150.7871.01'
}
